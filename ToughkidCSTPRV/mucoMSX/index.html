    <body style="margin: 0;">

        <div id="wmsx" style="text-align: center;">
            <div id="wmsx-screen"></div>

        <script src="wmsx.js"></script>

        <script>
            // mucoMSX defaults: MegaFlashROM SCC+ SD in Cartridge Slot 1, Makoto (YM2608) in Cartridge Slot 2
            WMSX.EXTENSIONS_CONFIG.MEGAFLASHSD.URL = "systemroms/extensions/mfrsd.rom.gz";
            WMSX.MEGAFLASHSD_SD1_URL = "sdcards/sd1.img.gz";     // Nextor FAT16 1GB
            WMSX.MEGAFLASHSD_SD2_URL = "sdcards/sd2.img.gz";     // Nextor FAT16 1GB
            WMSX.PRESETS_CONFIG._BASE._INCLUDE += ", MEGAFLASHSD, MAKOTO";
        </script>
